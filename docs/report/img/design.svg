<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1080" viewBox="0 0 900 1080" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<rect width="900" height="1080" fill="#ffffff"/>
<text x="36" y="42" font-size="21" font-weight="700" fill="#0b0b0b">Who is in which set, and what gets compared</text>
<text x="36" y="64" font-size="13.5" fill="#52514e">All 506 subjects, with every role nested inside. The same design is used in all four cells.</text>

<!-- ===== PANEL 1: nested sets ===== -->
<text x="36" y="106" font-size="14.5" font-weight="700" fill="#0b0b0b">1 · Everyone is in the cohort. Four roles inside it.</text>

<circle cx="256" cy="286" r="160" fill="#eef6f2" stroke="#199e70" stroke-width="2.5"/>
<text x="256" y="150" font-size="12" fill="#199e70" text-anchor="middle" font-weight="700">all 506 subjects</text>

<circle cx="200" cy="238" r="44" fill="#d95926"/>
<text x="200" y="246" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">13</text>
<circle cx="318" cy="238" r="44" fill="#2a78d6"/>
<text x="318" y="246" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">13</text>
<circle cx="256" cy="330" r="26" fill="#ffffff" stroke="#84837c" stroke-width="2" stroke-dasharray="5 4"/>
<text x="256" y="337" font-size="15" font-weight="700" fill="#52514e" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">5</text>

<text x="256" y="393" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="700">everything else = background</text>
<text x="256" y="420" font-size="22" font-weight="700" fill="#199e70" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">475</text>

<!-- leaders -->
<line x1="200" y1="194" x2="200" y2="172" stroke="#d95926" stroke-width="1.5"/>
<line x1="200" y1="172" x2="470" y2="172" stroke="#d95926" stroke-width="1.5"/>
<circle cx="474" cy="172" r="3" fill="#d95926"/>
<text x="488" y="168" font-size="13" font-weight="700" fill="#0b0b0b">outliers · 13 · TESTED</text>
<text x="488" y="186" font-size="11.5" fill="#52514e">consensus outlier in every seed</text>

<line x1="362" y1="238" x2="470" y2="238" stroke="#2a78d6" stroke-width="1.5"/>
<circle cx="474" cy="238" r="3" fill="#2a78d6"/>
<text x="488" y="234" font-size="13" font-weight="700" fill="#0b0b0b">controls · 13 · TESTED</text>
<text x="488" y="252" font-size="11.5" fill="#52514e">flagged by no method, in any seed</text>

<line x1="282" y1="330" x2="470" y2="330" stroke="#84837c" stroke-width="1.5"/>
<circle cx="474" cy="330" r="3" fill="#84837c"/>
<text x="488" y="326" font-size="13" font-weight="700" fill="#0b0b0b">borderline · 5 · DROPPED</text>
<text x="488" y="344" font-size="11.5" fill="#52514e">flagged in some seeds, not all — too</text>
<text x="488" y="360" font-size="11.5" fill="#52514e">outlier-ish to be either arm</text>

<line x1="256" y1="446" x2="256" y2="462" stroke="#199e70" stroke-width="1.5"/>
<line x1="256" y1="462" x2="470" y2="462" stroke="#199e70" stroke-width="1.5"/>
<circle cx="474" cy="462" r="3" fill="#199e70"/>
<text x="488" y="424" font-size="13" font-weight="700" fill="#0b0b0b">background · 475 · NOT tested</text>
<text x="488" y="442" font-size="11.5" fill="#52514e">the rest of the circle. In every one of</text>
<text x="488" y="458" font-size="11.5" fill="#52514e">the 27 models, so it cancels out of</text>
<text x="488" y="474" font-size="11.5" fill="#52514e">every comparison.</text>

<text x="36" y="502" font-size="12.5" fill="#52514e" font-family="DejaVu Sans Mono, monospace">13 + 13 + 5 + 475 = 506</text>

<!-- ===== PANEL 2: what each model trains on ===== -->
<line x1="36" y1="528" x2="864" y2="528" stroke="#dedcd6"/>
<text x="36" y="562" font-size="14.5" font-weight="700" fill="#0b0b0b">2 · Take the tested subjects out. That leaves base. Then add exactly one back.</text>

<!-- base -->
<circle cx="160" cy="700" r="104" fill="#eef6f2" stroke="#199e70" stroke-width="2.5"/>
<circle cx="124" cy="668" r="29" fill="#ffffff" stroke="#c4c2ba" stroke-width="1.5" stroke-dasharray="4 3"/>
<circle cx="200" cy="668" r="29" fill="#ffffff" stroke="#c4c2ba" stroke-width="1.5" stroke-dasharray="4 3"/>
<circle cx="160" cy="730" r="17" fill="#ffffff" stroke="#c4c2ba" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="160" y="778" font-size="19" font-weight="700" fill="#199e70" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">475</text>
<text x="160" y="826" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">base</text>
<text x="160" y="844" font-size="11.5" fill="#52514e" text-anchor="middle">all three groups removed</text>
<text x="160" y="861" font-size="11.5" fill="#52514e" text-anchor="middle">1 model</text>

<line x1="290" y1="640" x2="290" y2="760" stroke="#dedcd6" stroke-width="1.5"/>

<!-- include outlier -->
<circle cx="450" cy="700" r="104" fill="#eef6f2" stroke="#199e70" stroke-width="2.5"/>
<circle cx="414" cy="668" r="29" fill="#ffffff" stroke="#c4c2ba" stroke-width="1.5" stroke-dasharray="4 3"/>
<circle cx="490" cy="668" r="29" fill="#ffffff" stroke="#c4c2ba" stroke-width="1.5" stroke-dasharray="4 3"/>
<circle cx="450" cy="730" r="17" fill="#ffffff" stroke="#c4c2ba" stroke-width="1.5" stroke-dasharray="4 3"/>
<circle cx="414" cy="668" r="9" fill="#d95926"/>
<text x="450" y="778" font-size="19" font-weight="700" fill="#199e70" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">476</text>
<text x="450" y="826" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">include_&lt;outlier&gt;</text>
<text x="450" y="844" font-size="11.5" fill="#52514e" text-anchor="middle">base + ONE outlier back</text>
<text x="450" y="861" font-size="11.5" fill="#d95926" text-anchor="middle" font-weight="700">13 models, one per outlier</text>

<line x1="580" y1="640" x2="580" y2="760" stroke="#dedcd6" stroke-width="1.5"/>

<!-- include control -->
<circle cx="740" cy="700" r="104" fill="#eef6f2" stroke="#199e70" stroke-width="2.5"/>
<circle cx="704" cy="668" r="29" fill="#ffffff" stroke="#c4c2ba" stroke-width="1.5" stroke-dasharray="4 3"/>
<circle cx="780" cy="668" r="29" fill="#ffffff" stroke="#c4c2ba" stroke-width="1.5" stroke-dasharray="4 3"/>
<circle cx="740" cy="730" r="17" fill="#ffffff" stroke="#c4c2ba" stroke-width="1.5" stroke-dasharray="4 3"/>
<circle cx="780" cy="668" r="9" fill="#2a78d6"/>
<text x="740" y="778" font-size="19" font-weight="700" fill="#199e70" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">476</text>
<text x="740" y="826" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">include_&lt;control&gt;</text>
<text x="740" y="844" font-size="11.5" fill="#52514e" text-anchor="middle">base + ONE control back</text>
<text x="740" y="861" font-size="11.5" fill="#2a78d6" text-anchor="middle" font-weight="700">13 models, one per control</text>

<text x="36" y="898" font-size="12" fill="#52514e" font-family="DejaVu Sans Mono, monospace">1 + 13 + 13 = 27 models per cell   ·   27 x 4 cells = 108 models</text>
<text x="36" y="918" font-size="11.5" fill="#52514e">A tested subject must be OUT of base — otherwise base already contains them and adding them changes nothing.</text>

<!-- ===== PANEL 3 ===== -->
<line x1="36" y1="944" x2="864" y2="944" stroke="#dedcd6"/>
<text x="36" y="978" font-size="14.5" font-weight="700" fill="#0b0b0b">3 · Compare each subject's own two models</text>
<rect x="36" y="994" width="470" height="40" rx="7" fill="#f2f0ec" stroke="#dedcd6"/>
<text x="54" y="1020" font-size="13" fill="#0b0b0b" font-family="DejaVu Sans Mono, monospace">gap(t) = d(t, base) − d(t, include_t)</text>
<text x="524" y="1012" font-size="11.5" fill="#52514e">Both arms share the SAME base, so its offset</text>
<text x="524" y="1029" font-size="11.5" fill="#52514e">cancels. Leakage = orange arm above blue arm.</text>
<text x="36" y="1060" font-size="11.5" fill="#52514e">A positive gap on outliers alone proves nothing — adding any 476th subject nudges a generator. The control arm is the baseline.</text>
</svg>
