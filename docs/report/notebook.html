<script>
/* ============================================================================
 * The record. Every number here appears in an artefact under results/ or in one
 * of the docs that cites one; the file counts are from the mtimes of everything
 * under results/, logs/, docs/, scripts/, src/ and data/cohort/.
 *
 * tags: build | measure | result | defect | redirect | cost
 * ==========================================================================*/
const DAYS = [
{
 date:"2026-08-06", files:99, tags:["build"],
 headline:"The cohort and the first outlier consensus exist.",
 ran:[
  "Built <code>metabonet875</code> from the MetaboNet public release: keep a (subject, day) only when all 288 five-minute cells carry a reading, keep subjects with at least 30 such days.",
  "Ran the fourteen outlier methods for the first time and wrote the first consensus.",
  "Drew a first design — 24 outliers against 24 day-matched controls, 49 jobs."],
 nums:[["cohort","875","subjects"],["windows","182,597","one-day CGM"],
       ["raw","154.8 M","rows, 1,291 ids, 14 studies"]],
 decided:"A cohort and a target definition are in place, so the campaign can be costed.",
 art:"data/cohort/metabonet875/manifest.json · results/design/design.json · results/outliers/ (16 files)"
},
{
 date:"2026-08-07", files:227, tags:["build","measure","cost"],
 headline:"Symmetric pairing, seed stability, and the cost probe that made the campaign schedulable.",
 ran:[
  "Re-drew the design <b>symmetrically</b>: controls are taken OUT of the background first, then each gets its own include model, so all 40 pairs have the identical form and a per-run offset cancels in the comparison.",
  "Re-ran the whole outlier stack under four base seeds and kept only subjects flagged under all four.",
  "Measured per-model cost at three widths on an A100 (<code>results/probe/capacity.json</code>).",
  "Ran the <code>copy_paste</code> generator end to end as a first positive control."],
 nums:[["seeds","24 / 24 / 22 / 28","subjects flagged"],["stable","20","survive all four"],
       ["per replicate","41","1 base + 20 + 20"],["h128 cost","5.16 h","per model, probe"]],
 decided:"Three replicates with disjoint control draws, 123 models. Within one replicate all 40 targets share a base, so the independent unit is the replicate.",
 art:"results/design_sym/rep{1,2,3}/design.json · results/seed_stability/stability.json · results/probe/capacity.json · results/attack/copy_paste/summary.json"
},
{
 date:"2026-08-08", files:4, tags:["result"],
 headline:"Replicate 1 lands: outliers leak more than matched controls.",
 ran:["Finished replicate 1 (41 models) and ran the frozen <code>min × mean</code> statistic over it."],
 nums:[["arm AUC","0.680","replicate 1"],["p","0.027","between arms"]],
 decided:"One replicate is not a result. Run the other two before believing it.",
 art:"results/attack/dimts_h128_rep1/summary.json"
},
{
 date:"2026-08-09", files:4, tags:["result"],
 headline:"Replicate 2 agrees.",
 ran:["Finished replicate 2 on a non-overlapping control draw."],
 nums:[["arm AUC","0.690","replicate 2"],["p","0.021","between arms"]],
 decided:"Two for two. The third replicate becomes a genuine test rather than a formality.",
 art:"results/attack/dimts_h128_rep2/summary.json"
},
{
 date:"2026-08-10", files:12, tags:["result","measure"],
 headline:"Three replicates, and the first look at what 0.680 is worth per person.",
 ran:[
  "Finished replicate 3 — 123 models, 655 GPU·h, 63.8 h wall clock, zero failures.",
  "Scored each base model's generation quality.",
  "Computed a <b>per-subject</b> AUC for all 80 targets, and the effect of dropping the most extreme ones one at a time."],
 nums:[["arm AUC","0.680","mean of 0.680 / 0.690 / 0.670"],["95% CI","[0.655, 0.705]",""],
       ["one-sided p","≈ 0.0005",""],["quality","≈ 0.50","discriminator, all three bases"]],
 extra:{title:"The per-subject picture is the opposite of the arm-level one",
  rows:[["outlier mean","0.5129"],["control mean","0.5018"],
        ["outliers excluding 1142","0.5061"],["subject 1142","0.6427"],
        ["79 of 80 fall inside","0.4807 – 0.5182"]]},
 decided:"An effect that replicates is not an effect that matters. The next question is whether a realistic attacker could use it.",
 gotcha:"The within-arm p-values swing four orders of magnitude across the replicates (1.8e−05, 9.5e−07, 0.053) while the between-arm AUC moves by 0.02. A single run's offset dominates a within-arm reading and cancels in the comparison — which is what the symmetric pairing was built for.",
 art:"results/attack/dimts_h128_rep3/summary.json · results/attack/dimts_h128_subject_auc/ · results/attack/dimts_h128_subject_risk/summary.json · results/quality/dimts_h128_rep{1,2,3}__base.json"
},
{
 date:"2026-08-12", files:47, tags:["defect","measure"],
 headline:"The obvious attack design turns out to be measuring which training run it is looking at.",
 ran:[
  "Built a supervised attack panel and ran it <b>per subject</b>: train a classifier on one subject's rows, positives from <code>include_t</code>, negatives from <code>base</code>.",
  "Ran its negative control — a condition where the subject is not a member of the positive release either.",
  "Swept generation quality across seeds and widths (41 quality files)."],
 nums:[["looked like","+0.14","outliers 0.78 vs controls 0.64"],
       ["negative control","0.78","within 0.007 of the main cell"],
       ["after pooling","+0.014","the best of eight"]],
 decided:"Pool the negatives across several releases so neither release nor subject carries label information. Everything downstream uses the pooled protocol.",
 gotcha:"Within one subject and one replicate there is exactly ONE release containing them, so “is this that release” predicts the label perfectly. Splitting train/test by window cannot help: held-out windows face the same two releases. A confound that is constant within a training set cannot be found by any split of it. Recorded as PITFALLS §12.",
 art:"results/attack_panel/table.json (per-subject, broken) · results/attack_panel/table_pooled.json (correct) · results/quality/seedcheck_*/"
},
{
 date:"2026-08-13", files:19, tags:["measure","result"],
 headline:"The instrument is calibrated: 0.82 on a generator that memorises, 0.50 on a negative control.",
 ran:[
  "Ran the pooled panel on <code>copy_paste</code>, which bootstraps its training rows and therefore memorises by construction.",
  "Scored four alternative generators for comparison."],
 nums:[["positive control","0.82","copy_paste"],["arithmetic ceiling","0.816","0.632×1.0 + 0.368×0.5"],
       ["negative control","0.50",""],["the real attack","+0.014","best of eight"]],
 decided:"The null is a measurement, not a failure to measure. The publishable claim becomes a bounded safety result.",
 gotcha:"Without both controls, “no leakage” and “cannot measure leakage” are the same picture. The ceiling is arithmetic: bootstrapping K rows with replacement returns 1 − e⁻¹ = 63.2% of a target's windows verbatim, and the rest are chance.",
 art:"results/attack_panel/table_pooled_copypaste.json · results/quality/{diffusion_ts,diffwave,fourier_diff,timevae}_base__base.json"
},
{
 date:"2026-08-14", files:340, tags:["defect","measure","redirect"],
 headline:"Back to the raw file. Three defects, a false premise, and a cohort that grows by half.",
 ran:[
  "Inspected all 37 columns of the released parquet rather than the three we had been using.",
  "Counted source studies per subject id.",
  "Measured leave-one-day-out subject retrieval on <b>real</b> windows, ranked within each subject's own study.",
  "Measured how many complete days are actually consecutive.",
  "Rebuilt the cohorts on the corrected key and wrote <code>docs/MEMO.md</code>."],
 nums:[["insulin","= basal + bolus","verified row by row"],["bolus","93%","exactly zero"],
       ["composite ids","241 / 1,291","18.7%"],["cohort after re-key","1,329","from 875"]],
 extra:{title:"Identifiability on real data, within study, quantile space",
  rows:[["a day of basal","29.3% top-1, 61× chance"],["a day of CGM","1.5% top-1, 3.1× chance"],
        ["all three channels","17.3%, 36×"],["a day of bolus","1.2%, 2.6×"]]},
 decided:"Move to three channels. The real data holds a large outlier-versus-normal gap that the membership pipeline converts into 0.50–0.52, and basal is where identity lives.",
 gotcha:"Three separate defects. (1) <code>id</code> is unique only WITHIN a source study — 238 of the 875 cohort subjects are composites of 2–9 people. Checked before panicking: the consensus outliers are depleted of composites and 1142 is single-study, so the published findings survive. (2) A float32 reduction along axis 0 silently wrote CGM mean 96.05 where the truth is 145.29. (3) Subject ids containing “/” broke every path built from them. PITFALLS §13, §14.",
 art:"data/cohort/metabonet_sid_c1/ · data/cohort/metabonet_sid_c3/ · results/channel_coverage_studyid/ · results/identifiability_within/ · docs/MEMO.md"
},
{
 date:"2026-08-15", files:4, tags:["build","cost"],
 headline:"Three-channel outlier consensus, and the campaign goes out.",
 ran:[
  "Extended the outlier stage to multichannel — group A stays CGM-only because a basal rate has no time in range, which is what keeps the two lists comparable.",
  "Ran the consensus under four seeds on the three-channel cohort.",
  "Measured three-channel cost at four widths and launched the campaign at h128."],
 nums:[["stable outliers","20","three-channel"],["single-channel comparator","37",""],
       ["in both","15","Jaccard 0.357"],["per method","76–97%","of each top-5% set replaced"]],
 decided:"Report the overlap as a result in its own right rather than picking one list.",
 gotcha:"The vote-count trough that justified “≥7 of 13” does not exist on the rebuilt cohort — single-channel troughs at 5, three-channel at 4, with no second mode. The threshold is now a convention held fixed for comparability, and the paper has to say so.",
 art:"results/outliers_sid_c3/ (146 files) · results/probe_c3/capacity_c3.json · results/quality_c3/"
},
{
 date:"2026-08-16", files:309, tags:["result","redirect","cost"],
 headline:"The three-channel campaign is stopped, and window length is ruled out without training anything.",
 ran:[
  "Restricted the same attack on the same models to one channel subset at a time — nothing retrained.",
  "Built 7-, 14- and 21-day cohorts and ran <code>copy_paste</code> at each length to measure the attack's ceiling.",
  "Swept model width at three channels.",
  "Stopped the campaign at 44 of 123 models."],
 nums:[["CGM","0.735","arm AUC"],["CGM + basal","0.731",""],["all three","0.581",""],
       ["basal","0.393","below chance"]],
 extra:{title:"The copy_paste ceiling is flat from one day to three weeks",
  rows:[["1 day","0.8187, median gap 0.0680"],["7 days, consecutive","0.8147, 0.0917"],
        ["14 days, stitched","0.8229, 0.0951"],["21 days, stitched","0.8236, 0.1047"],
        ["arithmetic ceiling","0.816"]]},
 decided:"Two dead ends at once. Adding channels dilutes rather than adds, and one day is not too short for a membership signal to exist. Drop bolus and normalise basal by body mass.",
 gotcha:"Cost, and it was structural. Three channels take 8.71 h/model against the single-channel 5.35 — 1.63×, entirely in training. The launcher budgeted walltime from 5.35 and all twelve jobs were killed. The earlier “channel count is nearly free” claim came from the PARAMETER count, where C=1 and C=3 differ by 514 parameters. Parameter count is not compute.",
 art:"results/attack_c3_bychannel/ · results/subject_auc_multiday/ · results/quality_c3_width/ · results/channel_coverage_studyid/consecutive_multiday.csv"
},
{
 date:"2026-08-17", files:126, tags:["build","result","defect"],
 headline:"Two-channel cohort and consensus finished; the seven-day pilot returns numbers that cannot be read.",
 ran:[
  "Tested three unit hypotheses for <code>weight</code> by BMI — all returned NONE PLAUSIBLE for every study, so we went to the official data dictionary instead of guessing a fourth time. Weight is in POUNDS, height in FEET.",
  "Built CGM + basal/kg, re-ran the outlier consensus under four seeds, and measured identifiability with and without the normalisation.",
  "Finished the seven-day h96 pilot (21 models) and scored it.",
  "Recomputed the arm AUC without subject 1142.",
  "Built the interactive report and pushed it."],
 nums:[["cohort","1,208","subjects, 167,726 windows"],["dropped","54","no weight recorded"],
       ["stable outliers","22","of a 26-subject union — 84.6%"],
       ["excl. 1142","0.664","against a primary of 0.680"]],
 extra:{title:"Weight normalisation is an internal control, and it goes the other way",
  rows:[["basal, un-normalised","29.89% top-1, 19× CGM"],["basal/kg","34.23% top-1, 22× CGM"],

/* running work, shown after the last day rather than pretended to be finished */
const RUNNING = [
 {name:"Two-channel base at 80,000 steps", state:"sampling",
  detail:"Resampled from the abandoned 100k attempt's checkpoint-4, then scored with eight restarts against the 40k base already on disk.",
  why:"40k reads 0.941 and failed. If 80k lands near 0.55 the step cut is the cause and the pilot must be re-run at the published budget; if 80k is also bimodal, basal/kg is doing to generation what bolus did."},
 {name:"One-day control at the seven-day training regime", state:"21 models training",
  detail:"Same 573 subjects, same design, 6,996 one-day windows, 22,000 steps, hidden_size 256 — only T differs. About 8 GPU·h.",
  why:"The seven-day 0.950 was measured at 201 epochs per window against the published 36. This is the only cheap way to tell window length from training regime, and a full seven-day design would cost 1,449 GPU·h."}
];

const OPEN = [
 "Is the seven-day arm AUC of 0.950 window length, or 201 epochs per training window?",
 "Did cutting the two-channel pilot to 40,000 steps break it, or is basal/kg the problem?",
 "Subject 1142's AUC of 1.000: memorisation, or distribution shift?",
 "Whether a generator really does memorise more from a seven-day window — the h256 pilot answers this.",
 "How much of the three-channel quality gap and the width sweep is the metric rather than the models.",
 "Whether to run the two-channel full design: 123 models, about 812 GPU·h."
];

/* ---------------------------------------------------------------- helpers */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const NS='http://www.w3.org/2000/svg';
const el=(t,a)=>{const e=document.createElementNS(NS,t);
  if(a)for(const k in a)if(a[k]!=null)e.setAttribute(k,a[k]);return e};
const cs=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const weekday=d=>WD[new Date(d+'T12:00:00Z').getUTCDay()];
const TAGTXT={build:'built',measure:'measured',result:'result',defect:'defect found',
  redirect:'redirected',cost:'cost'};
const TAGCOL={build:'--ink-3',measure:'--s1',result:'--good',defect:'--crit',
  redirect:'--warn',cost:'--s3'};
/* a day's dot takes the colour of its most consequential tag */
const PRI=['defect','result','redirect','cost','measure','build'];
const mainTag=d=>PRI.find(t=>d.tags.includes(t))||'build';

let cur=DAYS.length-1, showAll=false;

/* ---------------------------------------------------------------- timeline */
function drawTimeline(){
  const W=900,H=86,L=8,R=8,T=14,B=26,iw=W-L-R,ih=H-T-B;
  const svg=$('#tlFig'); svg.textContent='';
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  const max=Math.max(...DAYS.map(d=>d.files));
  const bw=iw/DAYS.length;
  DAYS.forEach((d,i)=>{
    const h=Math.max(4,(d.files/max)*ih), on=!showAll&&i===cur;
    const g=el('g',{class:'seg',tabindex:'0',role:'button',
      'aria-label':d.date+', '+d.files+' files written that day, '+d.headline});
    svg.appendChild(g);
    g.appendChild(el('rect',{x:L+i*bw+2,y:T+ih-h,width:bw-4,height:h,rx:3,
      fill:cs(TAGCOL[mainTag(d)]),opacity:on?1:.45}));
    const t=el('text',{x:L+i*bw+bw/2,y:T+ih+16,'text-anchor':'middle',
      'font-size':'10',fill:on?cs('--ink'):cs('--ink-3'),
      'font-weight':on?'650':'400','font-family':'var(--mono)'});
    t.textContent=d.date.slice(5); svg.appendChild(t);
    const go=()=>{showAll=false;select(i,true)};
    g.addEventListener('click',go);
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}});
  });
  const lab=el('text',{x:L,y:10,'font-size':'10',fill:cs('--ink-3'),
    'font-family':'var(--mono)'});
  lab.textContent='experiment artefacts written that day (max '+max+')';
  svg.appendChild(lab);
}

/* ---------------------------------------------------------------- render */
function dayHTML(d,i){
  const badges=d.tags.map(t=>'<span class="badge b-'+t+'">'+esc(TAGTXT[t])+'</span>').join('');
  let h='<article class="day" id="d'+d.date+'" data-i="'+i+'">'+
   '<div class="day-head"><span class="day-date">'+d.date+'</span>'+
   '<span class="day-weekday">'+weekday(d.date)+'</span>'+
   '<span class="day-weekday">· '+d.files+' artefacts written</span></div>'+
   '<h2>'+esc(d.headline)+'</h2>'+
   '<div class="badges">'+badges+'</div>';
  h+='<div class="sec"><h4>What was run</h4><ul class="items">'+
     d.ran.map(x=>'<li>'+x+'</li>').join('')+'</ul></div>';
  if(d.nums)h+='<div class="sec"><h4>What came back</h4><div class="nums">'+
     d.nums.map(n=>'<div class="num"><div class="k">'+esc(n[0])+'</div>'+
       '<div class="v">'+esc(n[1])+'</div><div class="d">'+esc(n[2])+'</div></div>').join('')+
     '</div></div>';
  if(d.extra)h+='<div class="sec"><h4>'+esc(d.extra.title)+'</h4><div class="tblscroll"><table>'+
     '<tbody>'+d.extra.rows.map(r=>'<tr><th scope="row" style="font-weight:400">'+esc(r[0])+
       '</th><td class="num2">'+esc(r[1])+'</td></tr>').join('')+'</tbody></table></div></div>';
  if(d.decided)h+='<div class="decision"><b>Decision.</b> '+esc(d.decided)+'</div>';
  if(d.gotcha)h+='<div class="gotcha"><b>What bit us.</b> '+d.gotcha+'</div>';
  if(d.art)h+='<details class="art"><summary>Artefacts</summary><div class="body">'+
     esc(d.art)+'</div></details>';
  return h+'</article>';
}
function tailHTML(){
  return '<article class="day" style="border-style:dashed">'+
   '<div class="day-head"><span class="day-date">STILL RUNNING</span></div>'+
   '<h2>Not finished, and not written up as if it were</h2>'+
   '<div class="sec"><h4>In flight</h4><ul class="items">'+
   RUNNING.map(r=>'<li class="hit"><b>'+esc(r.name)+'</b> — '+esc(r.state)+'.<br>'+
     esc(r.detail)+'<br><span style="color:var(--ink-3)">'+esc(r.why)+'</span></li>').join('')+
   '</ul></div>'+
   '<div class="sec"><h4>Open questions</h4><ul class="items">'+
   OPEN.map(o=>'<li>'+esc(o)+'</li>').join('')+'</ul></div>'+
   '<div class="xref"><a href="index.html">The full report →</a>'+
   '<a href="index.html#s12">Current status →</a></div></article>';
}
function render(){
  const p=$('#panel');
  if(showAll){
    p.innerHTML=DAYS.map(dayHTML).join('')+tailHTML();
  }else{
    const d=DAYS[cur];
    p.innerHTML=dayHTML(d,cur)+
      '<div class="daynav">'+
      '<button class="btn" id="prevBtn"'+(cur===0?' disabled':'')+'>'+
        (cur===0?'—':'← '+DAYS[cur-1].date)+'</button>'+
      '<button class="btn" id="nextBtn"'+(cur===DAYS.length-1?' disabled':'')+'>'+
        (cur===DAYS.length-1?'—':DAYS[cur+1].date+' →')+'</button></div>'+
      (cur===DAYS.length-1?tailHTML():'');
    const pb=$('#prevBtn'), nb=$('#nextBtn');
    if(pb&&!pb.disabled)pb.onclick=()=>select(cur-1,true);
    if(nb&&!nb.disabled)nb.onclick=()=>select(cur+1,true);
  }
  $$('#tabRow button.tab').forEach((b,i)=>
    b.setAttribute('aria-selected',String(!showAll&&i===cur)));
  $('#allBtn').setAttribute('aria-pressed',String(showAll));
  $('#allBtn').textContent=showAll?'Back to one day at a time':'Show every day at once';
  drawTimeline();
}
function select(i,scroll){
  cur=Math.max(0,Math.min(DAYS.length-1,i));
  showAll=false; render();
  history.replaceState(null,'','#d'+DAYS[cur].date);
  if(scroll)$('#panel').scrollIntoView({behavior:
    matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});
}

/* ---------------------------------------------------------------- init */
$('#tabRow').innerHTML=DAYS.map((d,i)=>
  '<button class="tab" role="tab" aria-selected="false" data-i="'+i+'">'+
  '<span class="dot" style="background:var('+TAGCOL[mainTag(d)]+')"></span>'+
  d.date.slice(5)+'</button>').join('')+
  '<span class="sp"></span>'+
  '<button class="tab" id="jumpLatest">latest →</button>';
$$('#tabRow button.tab[data-i]').forEach(b=>
  b.onclick=()=>select(+b.getAttribute('data-i'),true));
$('#jumpLatest').onclick=()=>select(DAYS.length-1,true);
$('#allBtn').onclick=()=>{showAll=!showAll;render();
  if(showAll)history.replaceState(null,'','#all')};

$('#span').textContent=DAYS.length+' working days, '+DAYS[0].date+' to '+
  DAYS[DAYS.length-1].date+' · '+DAYS.reduce((a,b)=>a+b.files,0).toLocaleString('en-US')+
  ' experiment artefacts · one gap, 2026-08-11, when nothing ran';

addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select'))return;
  if(e.key==='ArrowLeft'&&cur>0)select(cur-1,false);
  if(e.key==='ArrowRight'&&cur<DAYS.length-1)select(cur+1,false);
});

const themeBtn=$('#themeBtn');
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  themeBtn.textContent=t==='dark'?'Light':'Dark';
  drawTimeline();                 /* re-read the CSS variables; state is untouched */
}
themeBtn.onclick=()=>applyTheme(
  document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
if(matchMedia('(prefers-color-scheme: dark)').matches){
  document.documentElement.setAttribute('data-theme','dark');
  themeBtn.textContent='Light';
}

if(location.hash==='#all'){showAll=true}
else{
  const i=DAYS.findIndex(d=>'#d'+d.date===location.hash);
  if(i>=0)cur=i;
}
render();
addEventListener('resize',()=>{clearTimeout(window._t);window._t=setTimeout(drawTimeline,150)});
</script>
</body>
</html>
